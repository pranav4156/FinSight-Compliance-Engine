[project]
name = "finsight"
version = "0.1.0"
description = "Real-time AML compliance engine for Indian fintech"
authors = [
    {name = "Pranav Pujara",email = "pranav.pujara010@gmail.com"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn[standard] (>=0.43.0,<0.44.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "langchain (==0.2.16)",
    "langchain-openai (==0.1.23)",
    "langchain-community (==0.2.16)",
    "pgvector (>=0.4.2,<0.5.0)",
    "redis (==5.0.1)",
    "celery[redis] (>=5.6.3,<6.0.0)",
    "flower (>=2.0.1,<3.0.0)",
    "kafka-python-ng (>=2.2.3,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "prometheus-fastapi-instrumentator (>=7.1.0,<8.0.0)",
    "weasyprint (>=68.1,<69.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-multipart (>=0.0.22,<0.0.23)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "ruff (>=0.15.9,<0.16.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
